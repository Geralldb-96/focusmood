name: focusmood

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focusmood}
      POSTGRES_USER: ${POSTGRES_USER:-focusmood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-focusmood}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - focusmood-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-focusmood}
      DB_USER: ${POSTGRES_USER:-focusmood}
      DB_PASSWORD: ${DB_PASSWORD:-focusmood}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET with at least 32 characters}
      APP_ZONE: ${APP_ZONE:-America/Bogota}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  focusmood-postgres:
