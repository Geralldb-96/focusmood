services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: focusmood
      POSTGRES_USER: focusmood
      POSTGRES_PASSWORD: ${DB_PASSWORD:-focusmood}
    ports:
      - "5432:5432"
    volumes:
      - focusmood-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusmood -d focusmood"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/focusmood
      DB_USER: focusmood
      DB_PASSWORD: ${DB_PASSWORD:-focusmood}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  focusmood-db:
